# ==============================================================================
# ESPHome LiTime BMS BLE — Example Configuration
#
# Compatible with: LiTime, Redodo, PowerQueen LiFePO4 batteries with BLE5
#
# Step 1: Flash this config with only the scanner enabled (comment out
#          ble_client and the monitor section).
# Step 2: Check the ESPHome log for discovered LiTime devices.
# Step 3: Copy the MAC address and paste it into the ble_client section.
# Step 4: Uncomment the ble_client and monitor sections, re-flash.
# ==============================================================================

substitutions:
  name: "litime-bms"
  friendly_name: "LiTime BMS"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_password

captive_portal:

# ==============================================================================
# External component: LiTime BMS BLE
# ==============================================================================

external_components:
  - source:
      type: local
      path: components
    # For GitHub:
    # - source: github://rubenmuehlhans/litime-ble@main

# BLE tracker (required)
esp32_ble_tracker:
  scan_parameters:
    active: false

# ==============================================================================
# Scanner mode — finds all LiTime devices and logs their MAC addresses
# Comment this out once you have your MAC address.
# ==============================================================================

litime_bms_ble:
  - id: litime_scanner
    # No ble_client_id → scanner mode
    # Check the logs for:
    #   [I][litime_bms_ble]: Found LiTime device!
    #   [I][litime_bms_ble]:   Name: "LT-XXXXX"
    #   [I][litime_bms_ble]:   MAC:  AA:BB:CC:DD:EE:FF

# ==============================================================================
# Monitor mode — connects to a specific battery
# Uncomment the sections below and set the correct MAC address.
# ==============================================================================

